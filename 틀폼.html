<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>틀 넣기</title>
<style>
:root{--bg:#23201C;--card:#2E2A25;--line:#FBF6EC;--ink:#FBF6EC;--mute:#B9B0A0;--acc:#FF8A4C;--btn:#FFC480;--ok:#5FE39A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "JetBrains Mono","D2Coding","Cascadia Mono",Consolas,"Pretendard","Malgun Gothic",monospace;padding:14px 18px 40px;max-width:600px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;display:inline-block;color:#111;background:var(--btn);border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:2px 12px;border-radius:6px}.sub{color:var(--mute);font-size:13px;margin:10px 0 16px}
.card{background:var(--card);border:2.5px solid var(--line);box-shadow:5px 5px 0 var(--line);border-radius:8px;padding:16px;margin-bottom:20px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:6px;border:2px solid var(--line);background:#38332D;color:var(--ink)}
textarea{min-height:70px}
button{width:100%;font:inherit;font-weight:800;font-size:17px;padding:13px;border:2.5px solid var(--line);border-radius:8px;background:var(--btn);color:#111;margin-top:12px;box-shadow:4px 4px 0 var(--line);cursor:pointer}button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
button.g{background:#38332D;color:var(--ink)}button.t{background:#9CC4FF;color:#111}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.days button{margin:0;padding:12px 6px;font-size:16px;background:#38332D;color:var(--ink);box-shadow:3px 3px 0 var(--line)}.days button.on{background:var(--acc);color:#fff}.days small{display:block;font-size:12px;font-weight:500;opacity:.85}
.pick{margin-top:10px;font-size:13px;color:var(--mute)}.pick input{width:auto;padding:6px 10px;font-size:14px;margin-left:6px}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.out{display:none;margin-top:12px}.out textarea{min-height:150px;font-size:14px;background:#38332D}.out.show{display:block}.out b{display:block;margin-bottom:6px;color:var(--ok)}
a{color:#FFB38A}
</style></head><body><div id="메뉴" style="position:sticky;top:0;z-index:9;display:flex;gap:10px;flex-wrap:wrap;background:#23201C;padding:10px 0 12px;margin-bottom:10px;border-bottom:2.5px solid #FBF6EC"><a href="./" style="background:#38332D;color:#FBF6EC;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:10px;font-size:15px">대시보드</a><a href="./틀폼.html" style="background:#FBF6EC;color:#111;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:10px;font-size:15px">틀 넣기 · 다 됐어</a><a href="./트렌드/삼성전자.html" style="background:#38332D;color:#FBF6EC;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:10px;font-size:15px">삼성전자 트렌드</a><a href="./트렌드/테슬라.html" style="background:#38332D;color:#FBF6EC;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:10px;font-size:15px">테슬라 트렌드</a><a href="./편집.html" style="background:#38332D;color:#5FE39A;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:10px;font-size:15px">편집자용</a></div>
<h1>틀 넣기</h1>
<div class="sub">적고 "틀 보내기"를 누르면 바로 집 컴퓨터로 갑니다(1분 안에 받음). 안 될 때만 아래 텔레그램 단추를 쓰세요.</div>

<div class="card">
  <b>제목·썸네일 틀</b>
  <label>올리는 날</label>
  <div class="days" data-for="날1"></div><input type="hidden" id="날1">
  <div class="pick">다른 날이면 <input type="date" id="날1직접"></div>
  <label>채널</label><select id="채널1">
    <option value="주식독학">주식독학 1편 (21시)</option>
    <option value="주식독학_2">주식독학 2편 (12시)</option>
    <option value="테슬라">테슬라 (18시)</option>
  </select>
  <label>제목 (앞머리 [ 삼성전자 주가전망 ] 은 자동으로 붙음)</label><textarea id="제목" placeholder="반도체 폭락 비상상황 발생! 진짜 큰일난건가?"></textarea>
  <label>썸네일 윗줄 (노랑, 8~12자)</label><input id="윗줄" placeholder="비상상황 발생!!">
  <label>썸네일 아랫줄 (흰, 8~12자)</label><input id="아랫줄" placeholder="다음주 '이것' 놀라지 마세요">
  <label>사진 고르기 (선택 · 파일 이름에 든 말, 예 바닥지지)</label><input id="사진" placeholder="비우면 그날 날짜 사진">
  <button type="button" onclick="틀글()">틀 보내기</button>
  <div class="out" id="out1"><b id="상태1"></b><textarea id="글1" readonly></textarea>
    <button type="button" class="t" onclick="보내기('글1')">안 되면 텔레그램으로 보내기</button>
    <button type="button" class="g" onclick="복사('글1')">글 복사하고 봇 열기</button>
  </div>
  <div class="note">보내면 제목·썸네일만 바뀝니다. 공개 범위·시각은 그대로(일부공개). 고정댓글 다신 뒤 아래 "다 됐어"를 보내 주세요.</div>
</div>

<div class="card">
  <b>다 됐어 (고정댓글 달았음 → 예약으로 되돌리기)</b>
  <label>올리는 날</label>
  <div class="days" data-for="날2"></div><input type="hidden" id="날2">
  <div class="pick">다른 날이면 <input type="date" id="날2직접"></div>
  <label>채널</label><select id="채널2">
    <option value="주식독학">주식독학 1편</option>
    <option value="주식독학_2">주식독학 2편</option>
    <option value="테슬라">테슬라</option>
    <option value="">그날 전부</option>
  </select>
  <button type="button" onclick="됐어글()">다 됐어 보내기</button>
  <div class="out" id="out2"><b id="상태2"></b><textarea id="글2" readonly></textarea>
    <button type="button" class="t" onclick="보내기('글2')">안 되면 텔레그램으로 보내기</button>
    <button type="button" class="g" onclick="복사('글2')">글 복사하고 봇 열기</button>
  </div>
  <div class="note">예약 시각이 이미 지났으면 다음 인기 시각(7·12·18~22시) 빈 자리로 잡습니다.</div>
</div>
<script>
const 봇='https://t.me/jusikbox_alert_bot', 설문='https://docs.google.com/forms/d/e/1FAIpQLSeBdbfpt0WiF4dvseIEs-7otufSdC4KY8HCSZDcJznM0q6eXA/formResponse', 칸='entry.1521054935';
async function 설문보내기(글,상자){상자.textContent='보내는 중…';try{const fd=new FormData();fd.append(칸,글);await fetch(설문,{method:'POST',mode:'no-cors',body:fd});상자.textContent='보냈습니다 ✓ 집 컴퓨터가 1분 안에 받습니다.';return true;}catch(e){상자.textContent='못 보냈습니다 — 아래 단추로 텔레그램에 보내 주세요.';return false;}}
const f=(x)=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const 요일=["일","월","화","수","목","금","토"];
const 말날=(s)=>{const [y,m,d]=s.split("-").map(Number);return m+"월 "+d+"일";};
document.querySelectorAll('.days').forEach(box=>{const id=box.dataset.for,hid=document.getElementById(id),직접=document.getElementById(id+'직접');
  [["어제",-1],["오늘",0],["내일",1]].forEach(([n,d])=>{const dt=new Date();dt.setDate(dt.getDate()+d);const b=document.createElement('button');b.type='button';b.innerHTML=n+'<small>'+(dt.getMonth()+1)+'/'+dt.getDate()+' ('+요일[dt.getDay()]+')</small>';b.onclick=()=>{hid.value=f(dt);직접.value=f(dt);box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};box.appendChild(b);if(d===0)b.click();});
  직접.addEventListener('change',()=>{hid.value=직접.value;box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));});});
const v=(id)=>document.getElementById(id).value.trim();
function 틀글(){if(!v('제목')||!v('윗줄')||!v('아랫줄')){alert('제목·윗줄·아랫줄을 다 적어 주세요');return;}
  const 줄=[말날(v('날1'))+' 업로드','','['+v('채널1')+']','  제목 : '+v('제목'),'  썸네일 윗줄 : '+v('윗줄'),'  썸네일 아랫줄 : '+v('아랫줄')];if(v('사진'))줄.push('  사진 : '+v('사진'));
  document.getElementById('글1').value=줄.join('\n');document.getElementById('out1').classList.add('show');설문보내기(줄.join('\n'),document.getElementById('상태1'));}
function 됐어글(){const ch=v('채널2');const 글='다 됐어 '+말날(v('날2'))+(ch?' '+ch:'');document.getElementById('글2').value=글;document.getElementById('out2').classList.add('show');설문보내기(글,document.getElementById('상태2'));}
function 보내기(id){const t=document.getElementById(id).value;location.href='https://t.me/share/url?url='+encodeURIComponent(t);}
async function 복사(id){const t=document.getElementById(id).value;try{await navigator.clipboard.writeText(t);}catch(e){document.getElementById(id).select();document.execCommand('copy');}window.open(봇,'_blank');}
</script>
</body></html>
