<style>:root{--bg:#000;--ink:#F2E9D8;--mute:#9a9480;--acc:#FFC480;--line:#F2E9D8;--card:#0d0d0d;--shadow:#3a3a3a;--ok:#3DDC84}*{box-sizing:border-box}html,body{background:var(--bg)}body{margin:0;color:var(--ink);font:16px/1.55 "JetBrains Mono","Cascadia Mono","D2Coding",Consolas,"Pretendard","Malgun Gothic",monospace;padding:12px 18px 40px;background-image:linear-gradient(#0c0c0c 1px,transparent 1px),linear-gradient(90deg,#0c0c0c 1px,transparent 1px);background-size:28px 28px}a{color:#FFD9A8}#메뉴 a{font-size:15px!important;padding:9px 16px!important;border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);border-radius:8px!important}h1{font-size:22px;display:inline-block;background:var(--acc);color:#111;border:2px solid #111;box-shadow:4px 4px 0 var(--shadow);padding:2px 14px;border-radius:8px;margin:8px 0 6px}.sub{color:var(--mute);font-size:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow);border-radius:10px;padding:14px 16px}.card b{font-size:19px}.st{color:var(--acc);font-weight:800;margin:4px 0 8px}.ok{color:var(--ok);font-weight:800}.mute{color:var(--mute);font-size:13px;line-height:1.6}.card a.btn{display:inline-block;margin-top:10px;background:var(--acc);color:#111;text-decoration:none;font-weight:800;padding:8px 14px;border-radius:8px;border:2px solid #111;box-shadow:3px 3px 0 var(--shadow)}.off{opacity:.5;border-style:dashed}</style></head><body>

<div class="grid"></div>
<div class="card" style="margin-top:18px"><div class="calhead"><button type="button" onclick="달(-1)">◀</button><b id="달제목"></b><button type="button" onclick="달(1)">▶</button></div><div class="cal" id="cal"></div><div id="day"></div></div>
<style>.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal .h{text-align:center;font-size:12px;color:var(--mute)}.cal .d{min-height:86px;border:2px solid #444;border-radius:8px;background:#0d0d0d;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:6px 8px;font-size:14px;cursor:pointer;color:var(--ink);overflow:hidden}.cal .d b{font-size:14px}.cal .d.has{border-color:var(--line);background:#2a1f0c;font-weight:800}.cal .d.today{outline:3px solid var(--acc);outline-offset:-3px}.cal .d.sel{background:var(--acc);color:#111}.cal .d i{font-style:normal;font-size:11.5px;line-height:1.35;color:var(--ok);font-weight:700;margin-top:4px;text-align:left;word-break:keep-all}.cal .d.sel i{color:#111}.cal .d.x{opacity:.25;cursor:default}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead b{font-size:18px;color:var(--acc)}.calhead button{font:inherit;font-weight:800;padding:6px 12px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}#day{margin-top:14px;font-size:14px;line-height:1.6}#day .nm{color:var(--acc);font-weight:800}#day .n{color:var(--mute);font-size:12px}.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}.who div{background:var(--card);border:1.5px dashed #555;border-radius:8px;padding:8px 10px}</style>
<script>
const 팀기록={}, 사람들=[], 오늘="2026-11-05";
let Y=+오늘.slice(0,4),M=+오늘.slice(5,7)-1,sel=오늘;
function 그날(k){const t=팀기록[k]||{};let n=0;for(const p of 사람들)n+=(t[p.이름]||[]).length;return n;}
function 달(d){M+=d;if(M<0){M=11;Y--;}if(M>11){M=0;Y++;}그리기();}
function 글자(x){return String(x).replace(/</g,'&lt;');}
function 그리기(){document.getElementById('달제목').textContent=Y+'년 '+(M+1)+'월';let h=['일','월','화','수','목','금','토'].map(w=>'<div class="h">'+w+'</div>').join('');const first=new Date(Y,M,1).getDay(),last=new Date(Y,M+1,0).getDate();for(let i=0;i<first;i++)h+='<div class="d x"></div>';
  for(let d=1;d<=last;d++){const k=Y+'-'+String(M+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const n=그날(k);const fut=k>오늘;h+='<div class="d'+(n?' has':'')+(k===오늘?' today':'')+(k===sel?' sel':'')+(fut?' x':'')+'" '+(fut?'':'onclick="고르기(\''+k+'\')"')+'><b>'+d+'</b>'+(n?'<i>'+칸요약(k)+'</i>':'')+'</div>';}
  document.getElementById('cal').innerHTML=h;const t=팀기록[sel]||{};
  document.getElementById('day').innerHTML='<b>'+sel+'</b> <span class="n">'+(그날(sel)?'그날 한 일':'기록 없음')+'</span><div class="who">'+사람들.map(p=>{const l=t[p.이름]||[];let 안;if(!l.length)안='<span class="n">없음</span>';else if(p.종류==='수량'){안=l.map(h=>(h.항목.startsWith(p.항목이름+' ')?'✎ '+글자(h.항목)+'편':'✓ '+글자(h.항목))+' <span class="n">'+글자(h.때||'')+'</span>').join('<br>');}else 안=l.map(h=>'✓ '+글자(h.항목)+' <span class="n">'+글자(h.때||'')+'</span>').join('<br>');return '<div><span class="nm">'+글자(p.이름)+'</span><br>'+안+'</div>';}).join('')+'</div>';}
function 칸요약(k){const t=팀기록[k]||{};return 사람들.map(p=>{const l=t[p.이름]||[];if(!l.length)return '';if(p.종류==='수량'){const x=[...l].reverse().find(h=>h.항목.startsWith(p.항목이름+' '));const 나머지=l.filter(h=>!h.항목.startsWith(p.항목이름+' ')).map(h=>글자(h.항목));return 글자(p.이름)+' '+[x?글자(x.항목.slice(p.항목이름.length+1).trim())+'편':'',...나머지].filter(Boolean).join('·');}return 글자(p.이름)+' '+l.map(h=>글자(h.항목)).join('·');}).filter(Boolean).join('<br>');}
function 고르기(k){sel=k;그리기();}
그리기();
</script>
<script>(function(){function 붙이기(u){try{var x=new URL(u,location.href);if(x.origin!==location.origin||!(x.pathname.endsWith('.html')||x.pathname.endsWith('/')))return u;x.searchParams.set('t',Date.now().toString(36));return x.href;}catch(e){return u;}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.getAttribute('href').charAt(0)==='#'||a.target==='_blank')return;a.href=붙이기(a.getAttribute('href'));},true);
var m=document.querySelector('meta[http-equiv="refresh"]');var s=m?parseInt(m.content,10):0;if(m)m.remove();if(s>0)setTimeout(function(){location.replace(붙이기(location.pathname));},s*1000);})();</script></body></html>
