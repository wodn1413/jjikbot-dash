  for(let d=1;d<=last;d++){const k=Y+'-'+String(M+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const n=그날(k).length;const fut=k>오늘;h+='<div class="d'+(n?' has':'')+(k===오늘?' today':'')+(k===sel?' sel':'')+(fut?' x':'')+'" '+(fut?'':'onclick="고르기(\''+k+'\')"')+'>'+d+(n?'<i>'+(수량형?[수량값(그날(k))?수량값(그날(k))+'편':'',...그날(k).filter(u=>!u.startsWith(항목이름+' '))].filter(Boolean).join('·'):(n+'개'))+'</i>':'')+'</div>';}
  c.innerHTML=h;const l=그날(sel);document.getElementById('day').innerHTML='<b>'+sel+'</b> <span class="n">'+(l.length?(수량형?(수량값(l)?항목이름+' '+수량값(l)+'편':'')+(l.filter(u=>!u.startsWith(항목이름+' ')).length?' · '+l.filter(u=>!u.startsWith(항목이름+' ')).join(', '):''):'완료 '+l.length+'개'):'기록 없음')+'</span>'+(l.length?'<br>'+l.map(u=>'✓ '+u.replace(/</g,'&lt;')).join('<br>'):'');}
불러오기(오늘);
function 고르기(k){sel=k;불러오기(k);그리기();}
그리기();
</script><script>(function(){function 붙이기(u){try{var x=new URL(u,location.href);if(x.origin!==location.origin||!(x.pathname.endsWith('.html')||x.pathname.endsWith('/')))return u;x.searchParams.set('t',Date.now().toString(36));return x.href;}catch(e){return u;}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a||a.getAttribute('href').charAt(0)==='#'||a.target==='_blank')return;a.href=붙이기(a.getAttribute('href'));},true);
var m=document.querySelector('meta[http-equiv="refresh"]');var s=m?parseInt(m.content,10):0;if(m)m.remove();if(s>0)setTimeout(function(){location.replace(붙이기(location.pathname));},s*1000);})();</script></body></html>
