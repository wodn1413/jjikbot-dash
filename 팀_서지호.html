<script>

const 기록칸=document.getElementById('기록글');function 기록추가(u){if(기록칸.textContent.trim()==='아직 없음')기록칸.innerHTML='';else 기록칸.innerHTML+='<br>';기록칸.innerHTML+='✓ '+u.replace(/</g,'&lt;')+' (방금)';}
for(const u of 보낸)기록추가(u);
async function 완료(항목,btn){항목=(항목||'').trim();if(!항목)return alert('무슨 일을 했는지 적어 주세요');if(!confirm('"'+항목+'" 완료로 보낼까요?'))return;const o=document.getElementById('out');o.style.display='block';document.getElementById('out제').textContent='보내는 중…';document.getElementById('out설').textContent=항목;

  catch(e){document.getElementById('out제').textContent='못 보냈습니다';document.getElementById('out설').textContent='인터넷을 확인하고 다시 눌러 주세요.';document.getElementById('out대안').style.display='block';}}
